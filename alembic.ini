# Alembic configuration.
#
# The database URL is intentionally absent here: patches_please/migrations/env.py takes it from
# DATABASE_URL (see patches_please/db.py). Containers api/worker get the postgres host, and
# host-side migrations fall back to localhost. One variable name for everything.
#
# Comments are ASCII on purpose: Alembic reads this file in the system locale
# encoding, and non-ASCII text breaks migrations on a Windows host (cp1251).

[alembic]
script_location = patches_please/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
