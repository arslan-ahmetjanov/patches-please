<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Patches, Please</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: Canvas;
      color: CanvasText;
    }
    main {
      width: 100%;
      max-width: 22rem;
      padding: 2rem;
      border: 1px solid currentColor;
      border-radius: 0.5rem;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.25rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.9rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 1rem;
      padding: 0.5rem;
      font: inherit;
      border: 1px solid currentColor;
      border-radius: 0.25rem;
      background: Field;
      color: FieldText;
    }
    button {
      width: 100%;
      padding: 0.5rem;
      font: inherit;
      border: 0;
      border-radius: 0.25rem;
      background: Highlight;
      color: HighlightText;
      cursor: pointer;
    }
    .error {
      margin: 0 0 1rem;
      padding: 0.5rem;
      border: 1px solid currentColor;
      border-radius: 0.25rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Вход в Patches, Please</h1>
    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
