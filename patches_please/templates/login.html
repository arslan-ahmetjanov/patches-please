<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Вход · Patches, Please</title>
  <link rel="stylesheet" href="/static/brand.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="page-login">
  <main>
    <strong class="brand"><img src="/static/logo.svg" alt="" width="28" height="28">Patches, Please</strong>
    <h1>Вход</h1>
    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
