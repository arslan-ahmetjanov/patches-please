# Контракт REST API Patches, Please.
# Сгенерирован из app.openapi(); вручную не править.
# Перегенерация: uv run python -m scripts.export_openapi
# Сверка с приложением: uv run pytest tests/test_contract.py
openapi: 3.1.0
info:
  title: Patches, Please
  description: Автоматизированный контроль безопасности разработки в CI/CD
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - аутентификация
      summary: Вход в интерфейс
      description: 'Проверяет email и пароль, создаёт сессию браузера и ставит cookie `pp_session`.


        Неверный пароль и неизвестный email дают одинаковый ответ 401: наличие учётной записи не раскрывается.'
      operationId: api_login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Сессия создана, в Set-Cookie — токен сессии.
          headers:
            Set-Cookie:
              description: 'Cookie `pp_session`: HttpOnly, SameSite=Lax, Path=/, срок жизни 7 дней.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Неверный email или пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - аутентификация
      summary: Выход из интерфейса
      description: 'Удаляет строку `sessions` по хешу токена из cookie и очищает cookie.


        Без активной сессии отвечает 204: повторный вызов безопасен.'
      operationId: api_logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Сессия закрыта, cookie очищена.
          headers:
            Set-Cookie:
              description: Пустое значение `pp_session` с истёкшим сроком.
              schema:
                type: string
  /api/v1/projects:
    get:
      tags:
      - проекты
      summary: Проекты текущего пользователя
      description: 'Только проекты, где текущий пользователь участник.


        Отбор идёт по строкам `project_members`: чужие проекты в ответ не попадают. Порядок — от новых к старым.'
      operationId: api_list_projects_api_v1_projects_get
      responses:
        '200':
          description: Проекты, где пользователь участник; пустой массив — если их нет.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectResponse'
                type: array
                title: Response Api List Projects Api V1 Projects Get
        '401':
          description: Нет действующей сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
    post:
      tags:
      - проекты
      summary: Создать проект
      description: 'Создаёт проект и членство создателя с ролью `owner` одной транзакцией.


        Slug уникален: занятый slug даёт 409, проект при этом не создаётся. Создавать проекты может любой аутентифицированный пользователь.'
      operationId: api_create_project_api_v1_projects_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '201':
          description: Проект создан, создатель — участник с ролью `owner`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: Нет действующей сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Проект с таким slug уже существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - cookieAuth: []
  /api/v1/projects/{project_id}/tokens:
    get:
      tags:
      - токены
      summary: Токены проекта
      description: 'Метаданные токенов проекта без открытых значений: открытое значение показывается только в ответе на создание.


        Порядок — от новых к старым, при равенстве времени — по названию. Список доступен участнику проекта; посторонний получает 404, чтобы существование чужого проекта не раскрывалось.'
      operationId: api_list_tokens_api_v1_projects__project_id__tokens_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Токены проекта; пустой массив — если их нет.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenListItem'
                title: Response Api List Tokens Api V1 Projects  Project Id  Tokens Get
        '401':
          description: Нет действующей сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Проект не найден или пользователь не его участник.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - cookieAuth: []
    post:
      tags:
      - токены
      summary: Создать токен проекта
      description: 'Создаёт токен для доступа из CI и возвращает открытое значение ровно один раз — в ответе 201.


        В базе хранится только SHA-256 токена. Создавать токены может только владелец проекта (`owner`); участник (`member`) получает 403, посторонний — 404.'
      operationId: api_create_token_api_v1_projects__project_id__tokens_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '201':
          description: Токен создан. Открытое значение `token` больше не отдаётся ни одним методом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Нет действующей сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь участник проекта, но не его владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Проект не найден или пользователь не его участник.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - cookieAuth: []
  /api/v1/projects/{project_id}/tokens/{token_id}:
    delete:
      tags:
      - токены
      summary: Отозвать токен проекта
      description: 'Помечает токен недействительным: заполняет `revoked_at`, строка остаётся в истории. Отозванный токен не проходит проверку.


        Повторный отзыв тоже отвечает 204. Отзывать токены может только владелец проекта; токен другого или несуществующего проекта — 404.'
      operationId: api_revoke_token_api_v1_projects__project_id__tokens__token_id__delete
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Token Id
      responses:
        '204':
          description: Токен отозван (в том числе повторно).
        '401':
          description: Нет действующей сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь участник проекта, но не его владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Проект или токен этого проекта не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - cookieAuth: []
  /api/v1/scans:
    post:
      tags:
      - прогоны
      summary: Запустить прогон
      description: 'Создаёт прогон со статусом `queued` и ставит задачу в очередь; отвечает 202.


        Доступ — токен проекта в заголовке `Authorization: Bearer pp_...`. Повторный запрос с тем же проектом и коммитом возвращает существующий прогон: второй строки и второй задачи не появляется. Провайдер (`github` или `gitlab`) записывается в историю, но на набор проверок и вердикт не влияет.'
      operationId: api_start_scan_api_v1_scans_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCreate'
      responses:
        '202':
          description: 'Прогон принят: строка создана или найдена, задача поставлена.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
        '401':
          description: Токен отсутствует, неизвестен или отозван.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /api/v1/scans/{scan_id}:
    get:
      tags:
      - прогоны
      summary: Статус прогона
      description: 'Возвращает статус прогона, коммит, ветку, провайдера, время создания и вердикт. CI поллит этот метод и завершает job по вердикту.


        Доступ — токен проекта, которым запускался прогон. Прогон другого проекта и несуществующий идентификатор выглядят одинаково — 404.'
      operationId: api_get_scan_api_v1_scans__scan_id__get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Scan Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Прогон этого проекта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
        '401':
          description: Токен отсутствует, неизвестен или отозван.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Прогон не найден или принадлежит другому проекту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /health:
    get:
      tags:
      - служебные
      summary: Проверка живости сервиса
      description: 'Отвечает 200, пока процесс принимает запросы.


        Используется healthcheck-ом Docker Compose и внешним мониторингом.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
      description: Ошибка запроса в едином формате.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: HealthResponse
      description: 'Ответ healthcheck-а: сервис принимает запросы.'
    LoginRequest:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 1
          title: Email
        password:
          type: string
          maxLength: 1024
          minLength: 1
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
      description: Учётные данные для входа в интерфейс.
    ProjectCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        slug:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]{1,99}$
          title: Slug
        repo_url:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Repo Url
        default_branch:
          type: string
          maxLength: 255
          minLength: 1
          title: Default Branch
          default: main
      type: object
      required:
      - name
      - slug
      title: ProjectCreate
      description: Данные создания проекта. Slug вводится вручную, repo_url необязателен.
    ProjectResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
        repo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Repo Url
        default_branch:
          type: string
          title: Default Branch
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - slug
      - repo_url
      - default_branch
      - created_at
      title: ProjectResponse
      description: Проект в ответе API.
    Provider:
      type: string
      enum:
      - github
      - gitlab
      title: Provider
      description: CI-провайдер, из которого пришёл запуск. На проверку не влияет (FR-019).
    ScanCreate:
      properties:
        commit_sha:
          type: string
          pattern: ^[0-9a-f]{40}(?:[0-9a-f]{24})?$
          title: Commit Sha
        ref:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^\S+$
          title: Ref
        provider:
          $ref: '#/components/schemas/Provider'
      type: object
      required:
      - commit_sha
      - ref
      - provider
      title: ScanCreate
      description: 'Запуск прогона: что именно проверять. Провайдер — только для истории.'
    ScanResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          $ref: '#/components/schemas/ScanStatus'
        commit_sha:
          type: string
          title: Commit Sha
        ref:
          type: string
          title: Ref
        provider:
          $ref: '#/components/schemas/Provider'
        created_at:
          type: string
          format: date-time
          title: Created At
        verdict:
          anyOf:
          - $ref: '#/components/schemas/Verdict'
          - type: 'null'
      type: object
      required:
      - id
      - status
      - commit_sha
      - ref
      - provider
      - created_at
      - verdict
      title: ScanResponse
      description: 'Прогон в ответе API: одинаковый набор полей у POST и GET.'
    ScanStatus:
      type: string
      enum:
      - queued
      - running
      - done
      - error
      title: ScanStatus
      description: 'Статусы прогона из плана: переходы по ним вводит T-009.'
    TokenCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
      type: object
      required:
      - name
      title: TokenCreate
      description: 'Название токена: по нему владелец отличает токены в списке.'
    TokenListItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        created_at:
          type: string
          format: date-time
          title: Created At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      type: object
      required:
      - id
      - name
      - created_at
      - last_used_at
      - revoked_at
      title: TokenListItem
      description: 'Токен в списке: только метаданные, без открытого значения.'
    TokenResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        token:
          type: string
          title: Token
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - token
      - created_at
      title: TokenResponse
      description: Созданный токен. `token` — открытое значение, единственный раз.
    UserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          title: Email
        role:
          type: string
          title: Role
      type: object
      required:
      - id
      - email
      - role
      title: UserResponse
      description: Пользователь, от имени которого открыта сессия.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Verdict:
      type: string
      enum:
      - pass
      - fail
      title: Verdict
      description: Вердикт по политике проекта (FR-004); до T-017 остаётся `null`.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pp_session
      description: 'Cookie-сессия интерфейса: ставится `POST /api/v1/auth/login`, живёт 7 дней, HttpOnly, SameSite=Lax, Path=/.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pp_<token>
      description: 'Токен проекта для CI: `Authorization: Bearer pp_...`, выдаётся `POST /api/v1/projects/{project_id}/tokens`. Требуется методами прогонов: запуск и поллинг статуса.'
