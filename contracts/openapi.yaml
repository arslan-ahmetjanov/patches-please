# Контракт REST API Security Gate.
# На этапе 2 описаны служебный эндпоинт, вход/выход (T-004) и проекты (T-005);
# полный контракт собирается в T-007.
openapi: 3.1.0
info:
  title: Security Gate
  description: Автоматизированный контроль безопасности разработки в CI/CD
  version: 0.1.0
paths:
  /health:
    get:
      tags:
        - служебные
      summary: Проверка живости сервиса
      description: "Отвечает 200, пока процесс принимает запросы.\n\nИспользуется healthcheck-ом Docker Compose и внешним мониторингом."
      operationId: health_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      tags:
        - аутентификация
      summary: Вход в интерфейс
      description: "Проверяет email и пароль, создаёт сессию браузера и ставит cookie `security_gate_session`.\n\nНеверный пароль и неизвестный email дают одинаковый ответ 401: наличие учётной записи не раскрывается."
      operationId: api_login_api_v1_auth_login_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Сессия создана, в Set-Cookie — токен сессии."
          headers:
            Set-Cookie:
              description: "Cookie `security_gate_session`: HttpOnly, SameSite=Lax, Path=/, срок жизни 7 дней."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Неверный email или пароль.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/auth/logout:
    post:
      tags:
        - аутентификация
      summary: Выход из интерфейса
      description: "Удаляет строку `sessions` по хешу токена из cookie и очищает cookie.\n\nБез активной сессии отвечает 204: повторный вызов безопасен."
      operationId: api_logout_api_v1_auth_logout_post
      responses:
        "204":
          description: "Сессия закрыта, cookie очищена."
          headers:
            Set-Cookie:
              description: "Пустое значение `security_gate_session` с истёкшим сроком."
              schema:
                type: string
  /api/v1/projects:
    get:
      tags:
        - проекты
      summary: Проекты текущего пользователя
      description: "Только проекты, где текущий пользователь участник.\n\nОтбор идёт по строкам `project_members`: чужие проекты в ответ не попадают. Порядок — от новых к старым."
      operationId: api_list_projects_api_v1_projects_get
      responses:
        "200":
          description: Проекты, где пользователь участник; пустой массив — если их нет.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Нет действующей сессии.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - проекты
      summary: Создать проект
      description: "Создаёт проект и членство создателя с ролью `owner` одной транзакцией.\n\nSlug уникален: занятый slug даёт 409, проект при этом не создаётся. Создавать проекты может любой аутентифицированный пользователь."
      operationId: api_create_project_api_v1_projects_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Проект создан, создатель — участник с ролью `owner`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Нет действующей сессии.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Проект с таким slug уже существует.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    HealthResponse:
      type: object
      title: HealthResponse
      description: "Ответ healthcheck-а: сервис принимает запросы."
      properties:
        status:
          type: string
          const: ok
          default: ok
          title: Status
    LoginRequest:
      type: object
      title: LoginRequest
      description: "Учётные данные для входа в интерфейс."
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
          title: Email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          title: Password
      required:
        - email
        - password
    UserResponse:
      type: object
      title: UserResponse
      description: "Пользователь, от имени которого открыта сессия."
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          title: Email
        role:
          type: string
          title: Role
      required:
        - id
        - email
        - role
    ErrorResponse:
      type: object
      title: ErrorResponse
      description: "Ошибка запроса в едином формате."
      properties:
        detail:
          type: string
          title: Detail
      required:
        - detail
    ProjectCreate:
      type: object
      title: ProjectCreate
      description: "Данные создания проекта. Slug вводится вручную, repo_url необязателен."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          title: Name
        slug:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9-]{1,99}$"
          title: Slug
        repo_url:
          anyOf:
            - type: string
              maxLength: 2048
            - type: "null"
          title: Repo Url
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
          default: main
          title: Default Branch
      required:
        - name
        - slug
    ProjectResponse:
      type: object
      title: ProjectResponse
      description: "Проект в ответе API."
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
        repo_url:
          anyOf:
            - type: string
            - type: "null"
          title: Repo Url
        default_branch:
          type: string
          title: Default Branch
        created_at:
          type: string
          format: date-time
          title: Created At
      required:
        - id
        - name
        - slug
        - repo_url
        - default_branch
        - created_at
    ValidationError:
      type: object
      title: ValidationError
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      required:
        - loc
        - msg
        - type
    HTTPValidationError:
      type: object
      title: HTTPValidationError
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
