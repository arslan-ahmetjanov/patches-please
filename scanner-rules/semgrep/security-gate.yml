# Локальные правила Semgrep для образа worker (T-013, FR-030).
#
# Набор намеренно небольшой: он проверяет, что офлайн-прогон работает без
# реестра правил. Расширение — добавление файлов .yml в этот каталог и
# пересборка образа; порядок описан в docs/scanners.md.
rules:
  - id: security-gate.python.eval
    languages:
      - python
    message: Вызов eval исполняет произвольный код из строки
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
    pattern: eval(...)

  - id: security-gate.python.subprocess-shell-true
    languages:
      - python
    message: subprocess с shell=True передаёт команду оболочке
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
    pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: security-gate.python.pickle-loads
    languages:
      - python
    message: pickle.loads исполняет код из недоверенных данных
    severity: WARNING
    metadata:
      category: security
      confidence: MEDIUM
    pattern: pickle.loads(...)
